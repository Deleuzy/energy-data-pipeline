[project]
name = "energy-data-pipeline"
version = "0.1.0"
description = "Fetch, validate, store and report Danish grid CO2 intensity from Energinet's Energi Data Service, with a scope 2 calculator."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "sqlalchemy>=2.0",
    "plotly>=5.18",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dagster = ["dagster>=1.8", "dagster-webserver>=1.8"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
edp = "edp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
module_name = "edp.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
